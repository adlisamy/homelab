---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: default
      sectionName: web
  hostnames:
    - argocd.gateway.lab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
