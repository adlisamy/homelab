---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: default
      sectionName: web
  hostnames:
    - grafana.gateway.lab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80