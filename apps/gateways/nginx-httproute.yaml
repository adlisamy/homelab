---
# Example Gateway API route for the demo workload declared in
# apps/demo-services/nginx-test.yaml.
#
# The host is deliberately different from the Traefik Ingress shipped with
# that demo (test.ingress.lab) so the Ingress and Gateway API paths can be
# exercised side by side without competing for the same hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-test
  namespace: default
  labels:
    app.kubernetes.io/part-of: platform
spec:
  parentRefs:
    - name: traefik-gateway
  hostnames:
    - test.gateway.lab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx-test
          port: 80
