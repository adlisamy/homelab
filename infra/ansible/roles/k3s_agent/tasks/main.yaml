---
- name: Configure shared K3s runtime prerequisites
  ansible.builtin.import_role:
    name: k3s_preqs
    tasks_from: runtime.yaml

- name: Apply containerd configuration changes
  ansible.builtin.meta: flush_handlers

- name: Read the K3s server node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_agent_server_token
  delegate_to: "{{ groups['k3s_servers'] | first }}"
  run_once: true
  no_log: true

- name: Create K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Configure K3s agent
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: '0600'
    owner: root
    group: root
    content: |
      server: "https://{{ hostvars[groups['k3s_servers'] | first].ansible_host }}:6443"
      token: "{{ k3s_agent_server_token.content | b64decode | trim }}"
      container-runtime-endpoint: "unix:///run/containerd/containerd.sock"
      node-ip: "{{ ansible_default_ipv4.address }}"
      kubelet-arg: "cgroup-driver=systemd"
  no_log: true
  notify: Restart k3s-agent

- name: Create systemd service file for K3s agent
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s-agent.service
    mode: '0644'
    owner: root
    group: root
    content: |
      [Unit]
      Description=Lightweight Kubernetes Agent
      Documentation=https://k3s.io
      After=network-online.target containerd.service
      Wants=network-online.target

      [Service]
      Type=notify
      ExecStart=/usr/local/bin/k3s agent
      KillMode=process
      Delegate=yes
      LimitNOFILE=1048576
      LimitNPROC=infinity
      LimitCORE=infinity
      TasksMax=infinity
      TimeoutStartSec=0
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: Restart k3s-agent

- name: Ensure K3s agent service is enabled and started
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for agent node to become Ready
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - node
      - "{{ inventory_hostname }}"
      - -o
      - "jsonpath={.status.conditions[?(@.type==\"Ready\")].status}"
  delegate_to: "{{ groups['k3s_servers'] | first }}"
  register: k3s_agent_node_ready
  changed_when: false
  until: k3s_agent_node_ready.stdout == 'True'
  retries: 24
  delay: 5

- name: Read the restricted worker kubectl token
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - --namespace=kube-system
      - get
      - secret
      - worker-kubectl-token
      - -o
      - 'jsonpath={.data.token}'
  delegate_to: "{{ groups['k3s_servers'] | first }}"
  register: k3s_agent_kubeconfig_token
  changed_when: false
  until: k3s_agent_kubeconfig_token.stdout | length > 0
  retries: 12
  delay: 5
  no_log: true

- name: Read the Kubernetes cluster CA certificate
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/tls/server-ca.crt
  delegate_to: "{{ groups['k3s_servers'] | first }}"
  register: k3s_agent_cluster_ca
  no_log: true

- name: Create kubectl configuration directory for the SSH user
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'

- name: Configure restricted kubectl access for the SSH user
  ansible.builtin.copy:
    dest: "/home/{{ ansible_user }}/.kube/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
    content: |
      apiVersion: v1
      kind: Config
      clusters:
        - name: homelab
          cluster:
            certificate-authority-data: {{ k3s_agent_cluster_ca.content }}
            server: https://{{ hostvars[groups['k3s_servers'] | first].ansible_host }}:6443
      contexts:
        - name: worker-read-only
          context:
            cluster: homelab
            namespace: default
            user: worker-kubectl
      current-context: worker-read-only
      users:
        - name: worker-kubectl
          user:
            token: {{ k3s_agent_kubeconfig_token.stdout | b64decode }}
  no_log: true
