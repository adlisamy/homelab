---
- name: Ensure that required packages are installed
  ansible.builtin.apt:
    name: "{{ k3s_preqs_packages }}"
    state: present

- name: Persist required kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    mode: '0644'
    content: |
      overlay
      br_netfilter

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Configure Kubernetes networking kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: net.ipv4.ip_forward, value: '1' }
    - { name: net.bridge.bridge-nf-call-iptables, value: '1' }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: '1' }
    - { name: net.ipv4.conf.all.rp_filter, value: '0' }
    - { name: net.ipv4.conf.default.rp_filter, value: '0' }

- name: Ensure that containerd configuration directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Check if containerd config.toml exists
  ansible.builtin.stat:
    path: /etc/containerd/config.toml
  register: k3s_preqs_containerd_config

- name: Generate default containerd configuration
  ansible.builtin.command: containerd config default
  register: k3s_preqs_default_config
  changed_when: false
  when: not k3s_preqs_containerd_config.stat.exists

- name: Write default containerd configuration to file
  ansible.builtin.copy:
    content: "{{ k3s_preqs_default_config.stdout }}"
    dest: /etc/containerd/config.toml
    mode: '0644'
  when: not k3s_preqs_containerd_config.stat.exists
  notify: Restart containerd

- name: Configure containerd to use the systemd cgroup driver
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = (true|false)'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

- name: Ensure that containerd is enabled and started
  ansible.builtin.service:
    name: containerd
    state: started
    enabled: true

- name: Ensure k3s binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_preqs_k3s_binary

- name: Download k3s binary archive
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
    dest: /usr/local/bin/k3s
    mode: '0755'
    owner: root
    group: root
  when: not k3s_preqs_k3s_binary.stat.exists

- name: Check if kubectl symlink exists
  ansible.builtin.stat:
    path: /usr/local/bin/kubectl
  register: k3s_preqs_kubectl_symlink

- name: Create symlink for kubectl
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link
  when: not k3s_preqs_kubectl_symlink.stat.exists
