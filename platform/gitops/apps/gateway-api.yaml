---
# Gateway API CRDs (standard channel).
#
# Traefik's chart stopped bundling these: the k3s traefik-crd release used to
# provide them, and it carries helm.sh/resource-policy: keep so they survive
# the addon being disabled. They are declared here anyway so that they are
# version-pinned in Git and can be recreated, instead of lingering as orphans
# of a release that no longer exists.
#
# Pinned to v1.5.1, the bundle version already installed in the cluster.
# sync-wave 0 so the CRDs exist before the GatewayClass (traefik, wave 1) and
# the Gateway/HTTPRoute objects (wave 2) are reconciled.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.5.1
    path: config/crd/standard
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Several of these CRDs overflow the client-side
      # last-applied-configuration annotation limit.
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
